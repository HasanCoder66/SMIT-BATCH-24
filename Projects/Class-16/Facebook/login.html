<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div id="container">
      <!-- left box -->
      <div id="left-box">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Facebook_Logo_2023.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
          alt=""
          id="fb-small-logo"
        />

        <h1>Explore the things <span id="text-blue">you love</span></h1>

        <div>
          <img
            src="./assets/U45qBJmWVHU.webp"
            alt=""
            height="200px"
            width="200px"
          />
        </div>
      </div>

      <!-- right box form box -->
      <div id="right-box">
        <h1>Log in to Facebook</h1>
        
        
        <!-- form area -->
        <form id="inputBoxes">
          <div id="email">
            <input type="email" placeholder="email address or mobile number" />
          </div>
          <div id="password">
            <input type="password" placeholder="password" />
          </div>

          <div id="login-button">
            <button>Log in </button>
          </div>
          <div id="forgot-button">
            <button>forgot password </button>
          </div>

           <div id="signup-button">
            <button>Create a New Account </button>
          </div>

          <div id="meta-logo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRnYlTHzIzf76dQP44xDtvT3fRI3c9C7B5DFVs8TgKXafimXRbehr-5pmE&s=10" alt="">Meta
          </div>
        </form>



      </div>
    </div>
  </body>
</html>
